name: coverage

# [coverage] The whole `cargo test --all-features` - the logic, and the sign-in flows of
# src/flow_tests.rs against a scratch PostgreSQL (the service below, SIGNON_TEST_DB;
# without one they would pass as skipped) - and its line coverage over src/. The badge is
# our own, no third party: drawn from lcov.info and kept on the `badges` branch (the last
# step), for the README to show. No gate yet: set --fail-under-lines once this has
# measured its figure here.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the coverage badge's push, to the badges branch
    # the flow tests' scratch database: a throwaway server for this run only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SIGNON_TEST_DB: postgres://postgres:postgres@localhost:5432/signon_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --no-fail-fast --lcov --output-path lcov.info
      # [coverage] our own badge, no third party: lcov.info's line coverage, drawn by
      # .github/coverage-badge.py and kept on the `badges` branch - one commit, replaced
      # each time. On a push to the default branch only: a pull request measures, no more
      - name: coverage badge
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pct=$(python3 .github/coverage-badge.py lcov.info /tmp/badges/coverage.svg)
          cd /tmp/badges
          git init -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "coverage ${pct}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
