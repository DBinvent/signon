# === what a request that went well is told, beside its status (no code: not an error) ===
note-check-email-account: "проверьте почту, чтобы активировать учётную запись"
note-check-email-subscription: "проверьте почту, чтобы подтвердить подписку"

# === notifications (src/notify.rs): why a message did not reach a channel, and the reasons of a channel that is not set up - the tail of SO-E040, no code of their own ===
err-notify-config: "SO-E040 не настроено: %{why}"
err-notify-refused: "SO-E041 отклонено с кодом %{status}%{reason}"
