# === mail: the code that finishes a sign-in through a provider (Templates::sign_in_code) ===
mail-code-subject: "Ваш код для входа в %{product}"
mail-code-intro: "Кто-то входит в %{product} через %{provider}, используя этот адрес."
mail-code-enter: "Введите этот код, чтобы завершить вход: %{code}"
mail-code-note: "Код действует один раз и истекает через час. Если это были не вы, не обращайте внимания на это письмо - без кода ничего не произойдёт."

# === mail: a password reset (Templates::reset) ===
mail-reset-subject: "Сброс пароля %{product}"
mail-reset-intro: "Перейдите по этой ссылке, чтобы задать новый пароль %{product}:"
