notify-no-mailer: "каналу электронной почты нужен mailer (Notifier::with_mailer)"
notify-no-client: "нет HTTP-клиента: %{why}"
notify-not-finished: "отправка не завершилась"
notify-template-unknown: "шаблона %{name} нет в этой сборке"
