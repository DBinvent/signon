# === mail: the confirmation of a new account (src/email.rs Templates::verify) ===
mail-verify-subject: "%{product} アカウントの確認"
mail-verify-intro: "メールアドレスを確認して %{product} アカウントを有効にしてください。"
mail-verify-code: "または確認ページでこのコードを入力してください: %{code}"
mail-verify-ignore: "このアカウントを作成していない場合は、このメールを無視してください。"

# === mail: the code that finishes a sign-in through a provider (Templates::sign_in_code) ===
mail-code-subject: "%{product} のサインインコード"
mail-code-intro: "このアドレスを使って、%{provider} で %{product} へのサインインが行われています。"
mail-code-enter: "完了するにはこのコードを入力してください: %{code}"
mail-code-note: "コードは一度だけ使え、1 時間で失効します。心当たりがない場合はこのメールを無視してください - コードがなければ何も起こりません。"

# === mail: a password reset (Templates::reset) ===
mail-reset-subject: "%{product} のパスワードの再設定"
mail-reset-intro: "このリンクから %{product} の新しいパスワードを設定してください:"
mail-reset-expiry: "リンクは一度だけ使え、%{hours} 時間で失効します。"
mail-reset-ignore: "心当たりがない場合はこのメールを無視してください - パスワードは変更されていません。"

# === mail: an address that already has an account (Templates::already_registered). %{link} and %{end} open and close the link of the HTML part ===
mail-exists-subject: "%{product} アカウントは既にお持ちです"
mail-exists-intro: "このアドレスで %{product} アカウントを作成しようとした人がいます - アカウントは既にあります。"
mail-exists-sign-in: "サインイン"
mail-exists-forgot-text: "パスワードをお忘れですか? 新しいパスワードを設定してください（リンクは一度だけ有効、%{hours} 時間で失効）:"
mail-exists-forgot-html: "パスワードをお忘れですか? %{link}新しいパスワードを設定%{end} - リンクは一度だけ使え、%{hours} 時間で失効します。"
mail-exists-ignore: "心当たりがない場合は何もする必要はありません - アカウントは変更されていません。"

